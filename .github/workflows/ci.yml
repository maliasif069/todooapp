name: CI

# Run the pipeline on every push and on every pull request into main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest unit tests
        run: npm test -- --ci

      - name: Report status
        if: always()
        run: echo "CI pipeline finished for commit ${{ github.sha }}"
